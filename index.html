<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <!-- Zorgt dat de pagina op een telefoon op ware grootte wordt getoond -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dagplanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Scherm 1: Morgen plannen -->
    <section id="scherm-morgen" class="scherm">
      <h1>Morgen plannen</h1>
      <p id="morgen-datum" class="datum"></p>

      <button id="kopieer-knop" class="kopieerknop">Kopieer plan van vandaag</button>

      <!-- Formulier om één taak toe te voegen. "required" = verplicht veld -->
      <form id="taak-formulier">
        <label>Taak
          <input name="naam" type="text" required>
        </label>
        <div class="rij">
          <label>Begintijd
            <input name="begintijd" type="time" required>
          </label>
          <label>Duur (minuten)
            <input name="duur" type="number" min="1" inputmode="numeric" required>
          </label>
        </div>
        <label>Hoe pak ik het aan?
          <input name="aanpak" type="text">
        </label>
        <label class="vinkje">
          <input name="focusblok" type="checkbox"> Focusblok
        </label>
        <label class="vinkje">
          <input name="belangrijkste" type="checkbox"> Belangrijkste taak van de dag
        </label>
        <button type="submit" id="opslaan-knop">Taak toevoegen</button>
        <!-- Alleen zichtbaar tijdens het bewerken van een taak -->
        <button type="button" id="annuleer-knop" class="knop-annuleren" hidden>Annuleren</button>
      </form>

      <!-- Hier zet JavaScript de lijst met taken neer -->
      <ul id="taken-morgen" class="takenlijst"></ul>

      <button id="plan-vastzetten" class="hoofdknop">Plan vastzetten</button>
      <p id="vastgezet-melding" class="melding" hidden></p>

      <!-- Bevestigingsvenster. <dialog> is een ingebouwd HTML-venster.
           method="dialog" sluit het venster als je op een van de knoppen tikt. -->
      <dialog id="vastzet-dialoog">
        <p>Weet je het zeker? Na vastzetten kun je het plan niet meer aanpassen.</p>
        <form method="dialog" class="dialoog-knoppen">
          <button class="knop-annuleren">Annuleren</button>
          <button class="knop-vastzetten">Vastzetten</button>
        </form>
      </dialog>
    </section>

    <!-- Scherm 2: Vandaag -->
    <section id="scherm-vandaag" class="scherm" hidden>
      <h1>Vandaag</h1>
      <p id="vandaag-datum" class="datum"></p>
      <p id="geen-plan" hidden>Er is voor vandaag geen plan.</p>

      <!-- Hier zet JavaScript de taken van vandaag neer, als tijdlijn -->
      <ol id="tijdlijn" class="tijdlijn"></ol>

      <!-- Terugblik: alleen 's avonds zichtbaar -->
      <div id="terugblik-kaart" class="kaart" hidden>
        <label>Wat ging goed, wat kan beter?
          <textarea id="terugblik" rows="3"></textarea>
        </label>
      </div>

      <!-- Extra taken: tellen niet mee voor de score -->
      <h2>Extra taak</h2>
      <form id="extra-formulier">
        <label>Taak
          <input name="naam" type="text" required>
        </label>
        <div class="rij">
          <label>Begintijd
            <input name="begintijd" type="time" required>
          </label>
          <label>Duur (minuten)
            <input name="duur" type="number" min="1" inputmode="numeric" required>
          </label>
        </div>
        <button type="submit">Extra taak toevoegen</button>
      </form>
    </section>

    <!-- Scherm 3: Score -->
    <section id="scherm-score" class="scherm" hidden>
      <h1>Score</h1>

      <div class="scorekaart">
        <p id="score-vandaag" class="getal"></p>
        <p>Score van vandaag (max. 100)</p>
      </div>

      <div class="scorekaart">
        <p id="score-week" class="getal"></p>
        <p>Weekgemiddelde (7 dagen vóór vandaag)</p>
      </div>

      <div class="scorekaart">
        <p id="score-reeks" class="getal"></p>
        <p>Dagen achter elkaar gepland</p>
      </div>
    </section>
  </main>

  <!-- Menu onderaan: elke knop weet via data-scherm welk scherm hij opent -->
  <nav class="menu">
    <button data-scherm="scherm-morgen" class="actief">Morgen</button>
    <button data-scherm="scherm-vandaag">Vandaag</button>
    <button data-scherm="scherm-score">Score</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
